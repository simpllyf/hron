[project]
name = "hron"
version = "2.2.1"
description = "Human-readable cron — scheduling expressions that read like English and convert to and from cron"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cron", "schedule", "human-readable", "hron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = ["tzdata>=2026.6"]

[project.urls]
Homepage = "https://github.com/simpllyf/hron"
Repository = "https://github.com/simpllyf/hron"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "ty==0.0.95"]

[tool.uv]
# Seven-day supply-chain buffer: resolve nothing published in the last week (depbot policy).
exclude-newer = "7 days"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
