name: Tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/tools.yml"

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: just

      - name: Install dependencies
        run: cd python && uv sync --locked

      - name: Format & Lint
        run: just lint-tools

      - name: Test
        run: just test-tools

      - name: Cases are deterministic
        run: |
          for seed in 1 2; do
            PYTHONHASHSEED=$seed python/.venv/bin/python -c "import hashlib, json, sys; sys.path.insert(0, 'tools/differential'); from cases import generate, generate_stress; print(hashlib.sha256(json.dumps([generate(), generate_stress()]).encode()).hexdigest())"
          done | uniq | wc -l | grep -qx 1
