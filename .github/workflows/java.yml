name: Java

on:
  push:
    branches: [main]
    paths: ["java/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/java.yml"]

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: just
      - name: Format check
        run: just lint-java

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: just
      - name: Build
        run: just build-java
      - name: Test
        run: just test-java
      - name: Build release artifacts (unsigned)
        run: cd java && mvn -B -P release -Dgpg.skip -DskipTests verify
