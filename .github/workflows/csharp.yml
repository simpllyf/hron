name: C#

on:
  push:
    branches: [main]
    paths: ["csharp/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/csharp.yml"]
  pull_request:
    paths: ["csharp/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/csharp.yml"]

jobs:
  check:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: dotnet just
      - name: Format check
        run: just lint-csharp

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: dotnet just
      - name: Install the tz link names (US/Eastern and the like), which ubuntu-26.04 leaves out
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tzdata-legacy
      - name: Build
        run: just build-csharp
      - name: Test
        run: just test-csharp
