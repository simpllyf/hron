name: C#

on:
  push:
    branches: [main]
    paths: ["csharp/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/csharp.yml"]
  pull_request:
    paths: ["csharp/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/csharp.yml"]

jobs:
  check:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: dotnet just
      - name: Format check
        run: just lint-csharp

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: dotnet just
      - name: Build
        run: just build-csharp
      - name: Test
        run: just test-csharp
