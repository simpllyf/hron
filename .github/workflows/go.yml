name: Go

on:
  push:
    branches: [main]
    paths: ["go/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/go.yml"]

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: go just
      - name: Format & Lint
        run: just lint-go

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: go just
      - name: Build
        run: just build-go
      - name: Test
        run: just test-go
      - name: Test (32-bit)
        run: just test-go
        env:
          GOARCH: "386"
