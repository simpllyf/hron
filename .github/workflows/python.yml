name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: just

      - name: Install dependencies
        run: cd python && uv sync --locked

      - name: Verify interpreter matches matrix
        run: cd python && uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}.'), sys.version"

      - name: Format & Lint
        run: just lint-python

      - name: Test
        run: just test-python

      - name: Build
        run: cd python && uv build
