name: Ruby

on:
  push:
    branches: [main]
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: ruby just
      - name: Test
        run: just test-ruby
      - name: Build gem
        run: cd ruby && gem build hron.gemspec

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: ruby just
      - name: Install dependencies
        run: bundle install
        working-directory: ruby
      - name: Lint
        run: just lint-ruby
