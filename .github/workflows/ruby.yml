name: Ruby

on:
  push:
    branches: [main]
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: ruby just
      - name: Install the tz link names (US/Eastern and the like), which ubuntu-26.04 leaves out
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tzdata-legacy
      - name: Test
        run: just test-ruby
      - name: Build gem
        run: cd ruby && gem build hron.gemspec

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: ruby just
      - name: Install dependencies
        run: bundle install
        working-directory: ruby
      - name: Lint
        run: just lint-ruby
